name: Projects drift

# Enumerates Cam's public repos and reports the ones missing from /projects/.
#
# Why this runs here and not inside the weekly Claude routine (Decision 0003): a cloud
# session's proxy only allows api.github.com endpoints scoped to the repos that session is
# bound to. /users/czabriskie/repos and the github.com profile page both answer 403, so a
# session cannot enumerate. An Actions runner has no such restriction. The routine reads
# the issue this job opens instead of listing repos itself.
on:
  schedule:
    # 13:45 UTC Monday, fifteen minutes ahead of the routine's 14:00.
    - cron: '45 13 * * 1'
  workflow_dispatch:

# Least privilege: read the repo, write the one issue.
permissions:
  contents: read
  issues: write

concurrency:
  group: projects-drift
  cancel-in-progress: false

jobs:
  drift:
    name: Check for unlisted public repos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const USER = 'czabriskie';
            const LABEL = 'projects-drift';
            const TITLE = 'Projects page drift: public repos not on /projects/';
            const { owner, repo } = context.repo;

            // Every repo the page already names, from the one file that holds them.
            const src = fs.readFileSync('src/lib/projects.ts', 'utf8');
            const listed = new Set(
              [...src.matchAll(/name:\s*'([^']+)'/g)].map((m) => m[1].toLowerCase()),
            );
            core.info(`page lists ${listed.size} repos`);

            // GITHUB_TOKEN is repo-scoped, so this returns public repos only. The private
            // filter below is belt and braces: a private repo must never reach the page.
            const repos = await github.paginate(github.rest.repos.listForUser, {
              username: USER,
              per_page: 100,
              type: 'owner',
            });

            const candidates = repos
              .filter((r) => !r.private && !r.fork && !r.archived && !listed.has(r.name.toLowerCase()))
              .sort((a, b) => b.pushed_at.localeCompare(a.pushed_at))
              .map((r) => ({
                name: r.name,
                language: r.language,
                description: r.description,
                pushed_at: r.pushed_at.slice(0, 10),
                size_kb: r.size,
                readme: `https://raw.githubusercontent.com/${USER}/${r.name}/${r.default_branch}/README.md`,
              }));

            core.info(`${repos.length} public repos, ${candidates.length} unlisted`);

            const open = (
              await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: LABEL })
            ).data;

            if (candidates.length === 0) {
              // Everything public is either on the page or deliberately left off, and the
              // routine has nothing to do. Close a stale issue so a merged PR tidies up
              // after itself.
              for (const issue of open) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: 'Every public repo is now accounted for on `/projects/`. Closing.',
                });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
              }
              return;
            }

            const rows = candidates
              .map((c) => `| \`${c.name}\` | ${c.language ?? '—'} | ${c.pushed_at} | ${c.description ?? '—'} |`)
              .join('\n');
            const body = [
              `${candidates.length} public repo(s) are not named in \`src/lib/projects.ts\`.`,
              '',
              'Being listed here is not a verdict. The curation rule in `docs/Decisions/0003-projects-page.md`',
              'still applies: a repo earns a spot by doing something. Practice repos and one-line READMEs stay off.',
              '',
              '| repo | language | last push | description |',
              '| --- | --- | --- | --- |',
              rows,
              '',
              '```json',
              JSON.stringify(candidates, null, 2),
              '```',
              '',
              `_Generated by \`.github/workflows/projects-drift.yml\` on ${new Date().toISOString().slice(0, 10)}._`,
            ].join('\n');

            if (open.length > 0) {
              await github.rest.issues.update({ owner, repo, issue_number: open[0].number, body });
              core.info(`updated issue #${open[0].number}`);
              return;
            }

            await github.rest.issues.getLabel({ owner, repo, name: LABEL }).catch(() =>
              github.rest.issues.createLabel({
                owner, repo, name: LABEL, color: '14707e',
                description: 'Public repos missing from the /projects/ page',
              }),
            );
            const created = await github.rest.issues.create({
              owner, repo, title: TITLE, body, labels: [LABEL],
            });
            core.info(`opened issue #${created.data.number}`);
